name: Daily Telugu Reel Factory

on:
  schedule:
    # Monday - Friday
    - cron: "0 2 * * 1-5"   # 7:30 AM IST (Morning)
    - cron: "0 14 * * 1-5"  # 7:30 PM IST (Evening)
    # Saturday
    - cron: "30 3 * * 6"    # 9:00 AM IST (Morning)
    - cron: "30 12 * * 6"   # 6:00 PM IST (Evening)
    # Sunday
    - cron: "0 4 * * 0"     # 9:30 AM IST (Morning)
    - cron: "30 14 * * 0"   # 8:00 PM IST (Evening)
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-ui-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run Pipeline (Testing Mode if no IG_SESSION)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          IG_SESSION: ${{ secrets.IG_SESSION }}
          MODE: "production"
        run: |
          python main.py

      - name: Commit and Push Database Updates
        if: always()
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add input/content_queue.json database/
          git commit -m "Auto-update database and content queue after reel generation" || echo "No changes to commit"
          git pull --rebase || echo "Pull failed"
          git push
